<!doctype html>
<meta charset="utf-8" />
<title>Recorder</title>
<script>
  // Hidden page that owns the microphone. Collects mono float samples while recording.
  let stream, context, source, node, chunks = [];

  const workletSource = `
    class Tap extends AudioWorkletProcessor {
      process(inputs) {
        const channel = inputs[0] && inputs[0][0];
        if (channel) this.port.postMessage(channel.slice(0));
        return true;
      }
    }
    registerProcessor("tap", Tap);`;

  async function start() {
    chunks = [];
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    context = new AudioContext();
    const url = URL.createObjectURL(new Blob([workletSource], { type: "application/javascript" }));
    await context.audioWorklet.addModule(url);
    source = context.createMediaStreamSource(stream);
    node = new AudioWorkletNode(context, "tap");
    node.port.onmessage = (event) => chunks.push(event.data);
    source.connect(node);
  }

  async function teardown() {
    source && source.disconnect();
    node && node.disconnect();
    stream && stream.getTracks().forEach((track) => track.stop());
    const rate = context ? context.sampleRate : 48000;
    context && (await context.close());
    source = node = stream = context = undefined;
    return rate;
  }

  window.voiceos.onRecorderStart(() => start().catch((e) => window.voiceos.sendRecorderError(String(e && e.message || e))));

  window.voiceos.onRecorderStop(async () => {
    const rate = await teardown();
    const total = chunks.reduce((n, c) => n + c.length, 0);
    const samples = new Float32Array(total);
    let offset = 0;
    for (const chunk of chunks) { samples.set(chunk, offset); offset += chunk.length; }
    chunks = [];
    window.voiceos.sendAudio(samples, rate);
  });

  window.voiceos.onRecorderCancel(async () => { await teardown(); chunks = []; });
</script>
