<!doctype html>
<meta charset="utf-8" />
<title>Voice OS</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: transparent; overflow: hidden; font: 13px -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
  /* A black shape hanging from the top edge of the screen, like an extension of the notch. */
  #notch {
    box-sizing: border-box; margin: 0 auto; width: fit-content; min-width: 220px; max-width: 520px;
    padding: 0 18px 12px; border-radius: 0 0 22px 22px; background: #000; color: #f5f5f7;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45); opacity: 0; transform: translateY(-12px) scaleY(0.9);
    transform-origin: top center; transition: opacity 0.18s, transform 0.22s cubic-bezier(0.2, 0.9, 0.3, 1.2);
  }
  #notch.show { opacity: 1; transform: none; }
  #notch.expanded { width: 520px; padding-bottom: 16px; }
  #row { display: flex; gap: 10px; align-items: center; min-height: 26px; }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: #8e8e93; flex: none; }
  .listening #dot { background: #ff453a; animation: pulse 1s infinite; }
  .thinking #dot { background: #ffd60a; animation: pulse 0.6s infinite; }
  .done #dot { background: #32d74b; }
  .error #dot { background: #ff9f0a; }
  #title { flex: 1; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .expanded #title { font-weight: 600; white-space: nowrap; display: block; }
  #close { display: none; flex: none; border: 0; background: rgba(255, 255, 255, 0.12); color: inherit; width: 22px; height: 22px; border-radius: 50%; font-size: 14px; line-height: 1; cursor: pointer; padding: 0; }
  #close:hover { background: rgba(255, 255, 255, 0.24); }
  .expanded #close { display: block; }
  #body, #steps, #actions { display: none; }
  .expanded #body { display: block; margin-top: 8px; max-height: 240px; overflow: auto; overflow-wrap: anywhere; line-height: 1.5; user-select: text; }
  #body p { margin: 0 0 8px; white-space: pre-wrap; } #body ul, #body ol { margin: 0 0 8px; padding-left: 20px; }
  #body pre { margin: 0 0 8px; padding: 8px 10px; border-radius: 8px; background: rgba(255, 255, 255, 0.09); overflow: auto; white-space: pre; font: 12px ui-monospace, Menlo, monospace; }
  #body code { padding: 1px 5px; border-radius: 4px; background: rgba(255, 255, 255, 0.12); font: 12px ui-monospace, Menlo, monospace; }
  #body pre code { padding: 0; background: none; } #body > :last-child { margin-bottom: 0; }
  .expanded #steps.has { display: block; margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(255, 255, 255, 0.14); }
  #steps h4 { margin: 0 0 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #8e8e93; }
  #steps ul { margin: 0; padding-left: 18px; color: #c7c7cc; max-height: 96px; overflow: auto; }
  .expanded #actions { display: flex; margin-top: 12px; gap: 8px; }
  #open { border: 0; border-radius: 8px; padding: 6px 12px; background: rgba(255, 255, 255, 0.14); color: inherit; font: inherit; cursor: pointer; }
  #open:hover { background: rgba(255, 255, 255, 0.26); }
  @keyframes pulse { 50% { opacity: 0.35; } }
</style>
<div id="notch">
  <div id="row"><span id="dot"></span><span id="title"></span><button id="close" type="button" aria-label="Dismiss">×</button></div>
  <div id="body"></div>
  <div id="steps"><h4>What I did</h4><ul id="stepList"></ul></div>
  <div id="actions"><button id="open" type="button">Open in Results</button></div>
</div>
<script>
  const notch = document.getElementById("notch");
  const title = document.getElementById("title");
  const body = document.getElementById("body");
  const steps = document.getElementById("steps");
  const stepList = document.getElementById("stepList");
  // Replies are model output: build DOM nodes from a small markdown subset and never inject HTML.
  const make = (tag, ...children) => { const node = document.createElement(tag); node.append(...children); return node; };
  function inline(text) {
    return text.split(/(`[^`\n]+`|\*\*[^*\n]+\*\*)/).filter(Boolean).map(part =>
      part.startsWith("`") ? make("code", part.slice(1, -1))
        : part.startsWith("**") && part.length > 4 ? make("strong", part.slice(2, -2)) : part);
  }
  function markdown(text) {
    const nodes = []; let list = null, paragraph = [], fence = null;
    const flush = () => { if (paragraph.length) nodes.push(make("p", ...inline(paragraph.join("\n")))); paragraph = []; };
    for (const line of text.split("\n")) {
      if (fence) { if (line.trim().startsWith("```")) { nodes.push(make("pre", make("code", fence.join("\n")))); fence = null; } else fence.push(line); continue; }
      const item = line.match(/^\s*(?:([-*•])|\d+[.)])\s+(.*)$/);
      if (line.trim().startsWith("```")) { flush(); list = null; fence = []; }
      else if (item) {
        flush(); const tag = item[1] ? "ul" : "ol";
        if (!list || list.tagName.toLowerCase() !== tag) { list = make(tag); nodes.push(list); }
        list.append(make("li", ...inline(item[2])));
      } else if (!line.trim()) { flush(); list = null; }
      else { list = null; paragraph.push(line); }
    }
    if (fence) nodes.push(make("pre", make("code", fence.join("\n"))));
    flush();
    return nodes;
  }
  window.voiceos.onOverlay(({ state, label, inset = 0, expanded = false, steps: done = [] }) => {
    // Keep content clear of the menu bar and the hardware notch, which share the top of the screen.
    notch.style.paddingTop = `${inset}px`;
    notch.className = state === "idle" ? "" : `show ${state}${expanded ? " expanded" : ""}`;
    title.textContent = expanded ? (state === "error" ? "Something went wrong" : "Done") : label || "";
    body.replaceChildren(...(expanded ? markdown(label || "") : []));
    stepList.replaceChildren(...done.map(text => Object.assign(document.createElement("li"), { textContent: text })));
    steps.className = expanded && done.length ? "has" : "";
  });
  // The window is sized to fit its content, because a clickable window blocks whatever is behind it.
  new ResizeObserver(() => window.voiceos.overlaySize(notch.offsetHeight + 24)).observe(notch, { box: "border-box" });
  notch.addEventListener("mouseenter", () => window.voiceos.overlayHover(true));
  notch.addEventListener("mouseleave", () => window.voiceos.overlayHover(false));
  document.getElementById("close").onclick = () => window.voiceos.overlayAction("dismiss");
  document.getElementById("open").onclick = () => window.voiceos.overlayAction("open");
</script>
